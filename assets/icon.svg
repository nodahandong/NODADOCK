<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0.15" y1="0" x2="0.85" y2="1">
      <stop offset="0" stop-color="#6F8CFF"/>
      <stop offset="0.55" stop-color="#4B4FE8"/>
      <stop offset="1" stop-color="#2A1F9E"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.3" cy="0.15" r="0.9">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.35"/>
      <stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="cloud" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#DCE3FF"/>
    </linearGradient>
    <linearGradient id="dock" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1B1466"/>
      <stop offset="1" stop-color="#120D4A"/>
    </linearGradient>
    <linearGradient id="dockTop" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8EA2FF"/>
      <stop offset="1" stop-color="#C6B8FF"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="0" dy="22" stdDeviation="26" flood-color="#0E0848" flood-opacity="0.45"/>
    </filter>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#0E0848" flood-opacity="0.35"/>
    </filter>
    <filter id="led" x="-200%" y="-200%" width="500%" height="500%">
      <feGaussianBlur stdDeviation="10"/>
    </filter>
  </defs>

  <!-- squircle tile -->
  <rect x="64" y="64" width="896" height="896" rx="210" fill="url(#bg)"/>
  <rect x="64" y="64" width="896" height="896" rx="210" fill="url(#glow)"/>

  <!-- dock / drive -->
  <g filter="url(#soft)">
    <rect x="214" y="628" width="596" height="150" rx="44" fill="url(#dock)"/>
    <rect x="214" y="628" width="596" height="22" rx="11" fill="url(#dockTop)" opacity="0.9"/>
    <rect x="270" y="690" width="250" height="26" rx="13" fill="#3B3496"/>
    <rect x="270" y="690" width="160" height="26" rx="13" fill="#7C8CFF"/>
    <circle cx="742" cy="703" r="24" fill="#3FE0A0" filter="url(#led)" opacity="0.9"/>
    <circle cx="742" cy="703" r="17" fill="#5CF2B6"/>
  </g>

  <!-- cloud docked on top -->
  <g filter="url(#shadow)">
    <path d="M338 610c-72 0-128-54-128-122 0-62 47-113 108-121 20-98 106-170 210-170 90 0 166 54 196 132 11-3 23-4 35-4 86 0 152 64 152 146 0 78-60 139-142 139z" fill="url(#cloud)"/>
  </g>
  <!-- down arrow into the dock -->
  <path d="M512 330v170" stroke="#4B4FE8" stroke-width="44" stroke-linecap="round"/>
  <path d="M440 432l72 72 72-72" fill="none" stroke="#4B4FE8" stroke-width="44" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
