name: Build installers

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            name: windows-x64
          - os: macos-latest
            target: aarch64-apple-darwin
            name: macos-apple-silicon
          - os: macos-latest
            target: x86_64-apple-darwin
            name: macos-intel
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - run: node scripts/fetch-rclone.mjs ${{ matrix.target }}
      - run: npm run build
      - name: Test
        shell: bash
        run: |
          set -o pipefail
          cargo test --manifest-path src-tauri/Cargo.toml --target ${{ matrix.target }} 2>&1 | tee test-${{ matrix.name }}.log
      - name: Publish test log on failure
        if: failure()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view builds >/dev/null 2>&1 || gh release create builds --prerelease --title "Latest builds" --notes "Installers built from the main branch."
          gh release upload builds test-${{ matrix.name }}.log --clobber
      - run: npx tauri build --target ${{ matrix.target }}
      - uses: actions/upload-artifact@v4
        with:
          name: NodaDock-${{ matrix.name }}
          path: |
            src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*.exe
            src-tauri/target/${{ matrix.target }}/release/bundle/msi/*.msi
            src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg
          if-no-files-found: error
      - name: Publish to the "builds" release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view builds >/dev/null 2>&1 || gh release create builds --prerelease --title "Latest builds" --notes "Installers built from the main branch." || true
          shopt -s nullglob
          for f in src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*.exe src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg; do
            gh release upload builds "$f" --clobber
          done
